<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Defibrillator Log</title>

<!-- PWA setup -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wagon Log">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">

<style>
  :root {
    --bg: #000000;
    --surface: #2c2c2e;
    --surface-active: #3a3a3c;
    --checked-missing: #ffd60a;
    --checked-missing-text: #1a1400;
    --checked-present: #22c55e;
    --checked-present-text: #04140a;
    --text: #ffffff;
    --muted: #8e8e93;
    box-sizing: border-box;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
  }

  body {
    display: flex;
    flex-direction: column;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: env(safe-area-inset-left, 0px);
    padding-right: env(safe-area-inset-right, 0px);
    overflow-x: hidden;
    user-select: none;
  }

  a.corner-link {
    position: fixed;
    top: calc(12px + env(safe-area-inset-top, 0px));
    left: calc(12px + env(safe-area-inset-left, 0px));
    z-index: 10;
    width: 52px;
    height: 52px;
    border-radius: 14px;
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    touch-action: manipulation;
  }

  a.corner-link:active {
    background: var(--surface-active);
  }

  a.corner-link svg {
    width: 26px;
    height: 26px;
  }

  header {
    flex-shrink: 0;
    padding: 18px 16px 10px;
    text-align: center;
  }

  h1 {
    margin: 0;
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  .subtitle {
    margin-top: 4px;
    font-size: 0.85rem;
    color: var(--muted);
  }

  main {
    flex: 1 1 auto;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 6px 12px 12px;
    width: 100%;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 12px;
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
  }

  button.wagon {
    appearance: none;
    border: none;
    border-radius: 16px;
    background: var(--surface);
    color: var(--text);
    font-size: 2rem;
    font-weight: 700;
    padding: 0;
    width: 100%;
    min-height: 110px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background-color 0.08s ease, transform 0.06s ease;
    touch-action: manipulation;
  }

  button.wagon:active {
    transform: scale(0.96);
  }

  button.wagon.checked-missing {
    background: var(--checked-missing);
    color: var(--checked-missing-text);
  }

  button.wagon.checked-present {
    background: var(--checked-present);
    color: var(--checked-present-text);
  }

  .key {
    max-width: 640px;
    margin: 6px auto 0;
    padding: 14px 16px;
    background: var(--surface);
    border-radius: 16px;
  }

  .key-title {
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 10px;
  }

  .key-row {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 0.95rem;
    padding: 4px 0;
  }

  .swatch {
    width: 20px;
    height: 20px;
    border-radius: 6px;
    flex-shrink: 0;
  }

  .swatch.default { background: var(--surface-active); }
  .swatch.missing { background: var(--checked-missing); }
  .swatch.present { background: var(--checked-present); }

  footer {
    flex-shrink: 0;
    padding: 10px 16px calc(16px + env(safe-area-inset-bottom, 0px));
    text-align: center;
    font-size: 0.8rem;
    color: var(--muted);
  }
</style>
</head>
<body>

<a class="corner-link" href="home.html" aria-label="Home">
  <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M15 5l-7 7 7 7" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
</a>

<header>
  <h1>Defibrillator Log</h1>
  <div class="subtitle">Tap a wagon to cycle its defibrillator status</div>
</header>

<main>
  <div class="grid" id="grid"></div>

  <div class="key">
    <div class="key-title">Key</div>
    <div class="key-row"><span class="swatch default"></span> Not checked yet</div>
    <div class="key-row"><span class="swatch missing"></span> Checked — no defibrillator / not flashing</div>
    <div class="key-row"><span class="swatch present"></span> Checked — defibrillator present &amp; flashing</div>
  </div>
</main>

<footer>Tap once for not present, again for present, again to reset</footer>

<script>
  const STORAGE_KEY = 'defibrillator-log-status';
  // status values: 0 = default/unchecked, 1 = checked, not present (yellow), 2 = checked, present (green)
  const WAGONS = [29, 16, 15, 2];

  let status = {};

  function loadStatus() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const obj = JSON.parse(raw);
        if (obj && typeof obj === 'object') status = obj;
      }
    } catch (e) {
      status = {};
    }
  }

  function saveStatus() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(status));
    } catch (e) {
      // storage unavailable — fail silently, app still works this session
    }
  }

  function classForStatus(s) {
    if (s === 1) return ' checked-missing';
    if (s === 2) return ' checked-present';
    return '';
  }

  function render() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    WAGONS.forEach(num => {
      const s = status[num] || 0;
      const btn = document.createElement('button');
      btn.className = 'wagon' + classForStatus(s);
      btn.textContent = num;
      btn.setAttribute('data-num', num);
      btn.addEventListener('click', () => cycleWagon(num));
      grid.appendChild(btn);
    });
  }

  function cycleWagon(num) {
    const current = status[num] || 0;
    status[num] = (current + 1) % 3;
    saveStatus();
    render();
  }

  loadStatus();
  render();

  // Register service worker for offline capability
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {
        // registration failed silently — app still works online
      });
    });
  }
</script>

</body>
</html>
