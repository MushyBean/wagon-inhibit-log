<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wagon Inhibit Log</title>

<!-- PWA setup -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Wagon Log">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">

<style>
  :root {
    --bg: #000000;
    --surface: #2c2c2e;
    --surface-active: #3a3a3c;
    --status-green: #22c55e;
    --status-green-text: #04140a;
    --status-yellow: #ffd60a;
    --status-yellow-text: #1a1400;
    --status-red: #ff3b30;
    --status-red-text: #2a0500;
    --text: #ffffff;
    --muted: #8e8e93;
    --clear: #ff3b30;
    --clear-active: #d92c22;
    box-sizing: border-box;
  }

  * {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
  }

  body {
    display: flex;
    flex-direction: column;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--text);
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    padding-left: env(safe-area-inset-left, 0px);
    padding-right: env(safe-area-inset-right, 0px);
    overflow-x: hidden;
    user-select: none;
  }

  header {
    flex-shrink: 0;
    padding: 18px 16px 10px;
    text-align: center;
  }

  h1 {
    margin: 0;
    font-size: 1.3rem;
    font-weight: 700;
    letter-spacing: 0.02em;
  }

  .subtitle {
    margin-top: 4px;
    font-size: 0.85rem;
    color: var(--muted);
  }

  .count {
    margin-top: 10px;
    font-size: 0.95rem;
    font-weight: 600;
    color: var(--status-green);
    min-height: 1.2em;
  }

  main {
    flex: 1 1 auto;
    overflow-y: auto;
    overflow-x: hidden;
    padding: 6px 12px 12px;
    width: 100%;
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 12px;
    max-width: 640px;
    width: 100%;
    margin: 0 auto;
  }

  button.wagon {
    appearance: none;
    border: none;
    border-radius: 16px;
    background: var(--surface);
    color: var(--text);
    font-size: 1.7rem;
    font-weight: 700;
    padding: 0;
    width: 100%;
    min-height: 76px;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background-color 0.08s ease, transform 0.06s ease;
    touch-action: manipulation;
  }

  button.wagon:active {
    transform: scale(0.95);
  }

  button.wagon.status-green {
    background: var(--status-green);
    color: var(--status-green-text);
  }

  button.wagon.status-yellow {
    background: var(--status-yellow);
    color: var(--status-yellow-text);
  }

  button.wagon.status-red {
    background: var(--status-red);
    color: var(--status-red-text);
  }

  .key {
    max-width: 640px;
    margin: 14px auto 0;
    padding: 14px 16px;
    background: var(--surface);
    border-radius: 16px;
  }

  .key-title {
    font-size: 0.8rem;
    font-weight: 700;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    margin-bottom: 10px;
  }

  .key-row {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    font-size: 0.95rem;
    padding: 5px 0;
    line-height: 1.3;
  }

  .swatch {
    width: 20px;
    height: 20px;
    border-radius: 6px;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .swatch.default { background: var(--surface-active); }
  .swatch.green { background: var(--status-green); }
  .swatch.yellow { background: var(--status-yellow); }
  .swatch.red { background: var(--status-red); }

  footer {
    flex-shrink: 0;
    padding: 10px 16px calc(16px + env(safe-area-inset-bottom, 0px));
  }

  button.clear {
    appearance: none;
    border: none;
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
    display: block;
    background: var(--clear);
    color: #fff;
    font-size: 1.25rem;
    font-weight: 700;
    padding: 18px 0;
    border-radius: 16px;
    touch-action: manipulation;
  }

  button.clear:active {
    background: var(--clear-active);
    transform: scale(0.98);
  }

  a.corner-link {
    position: fixed;
    top: calc(12px + env(safe-area-inset-top, 0px));
    right: calc(12px + env(safe-area-inset-right, 0px));
    z-index: 10;
    width: 52px;
    height: 52px;
    border-radius: 14px;
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: center;
    text-decoration: none;
    touch-action: manipulation;
  }

  a.corner-link:active {
    background: var(--surface-active);
  }

  a.corner-link svg {
    width: 28px;
    height: 28px;
  }
</style>
</head>
<body>

<a class="corner-link" href="defibrillator.html" aria-label="Defibrillator log">
  <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M12 21s-7.5-4.6-10-9.2C.5 8.3 2 4.5 5.6 4c2-.3 3.6.6 4.9 2.1L12 7.5l1.5-1.4c1.3-1.5 2.9-2.4 4.9-2.1 3.6.5 5.1 4.3 3.6 7.8C19.5 16.4 12 21 12 21z" fill="#ff3b30"/>
    <path d="M10.6 10.2h2.1l-1 2.6h2.4l-3.6 5 .9-3.6h-2l1.2-4z" fill="#ffd60a"/>
  </svg>
</a>

<header>
  <h1>Wagon Inhibit Log</h1>
  <div class="subtitle">Tap a wagon to cycle its inhibit status</div>
  <div class="count" id="count"></div>
</header>

<main>
  <div class="grid" id="grid"></div>

  <div class="key">
    <div class="key-title">Key</div>
    <div class="key-row"><span class="swatch default"></span> Not in inhibit</div>
    <div class="key-row"><span class="swatch green"></span> Inhibit — confirmed by Chef</div>
    <div class="key-row"><span class="swatch yellow"></span> Inhibit — unconfirmed by Chef</div>
    <div class="key-row"><span class="swatch red"></span> Inhibit — must be put back in</div>
  </div>
</main>

<footer>
  <button class="clear" id="clearBtn">Clear</button>
</footer>

<script>
  const STORAGE_KEY = 'wagon-inhibit-selected';
  const EXCLUDED = new Set([15, 16]);
  const wagons = [];
  for (let n = 3; n <= 28; n++) {
    if (!EXCLUDED.has(n)) wagons.push(n);
  }

  // status values: 0 = default/not in inhibit, 1 = green (confirmed by Chef),
  // 2 = yellow (unconfirmed by Chef), 3 = red (must be put back in)
  const STATUS_CLASS = { 1: 'status-green', 2: 'status-yellow', 3: 'status-red' };
  let status = {};

  function loadSelection() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (Array.isArray(parsed)) {
          // Migrate from the old format (a plain list of selected wagon
          // numbers, which only ever meant "green"/confirmed).
          status = {};
          parsed.forEach(num => { status[num] = 1; });
        } else if (parsed && typeof parsed === 'object') {
          status = parsed;
        }
      }
    } catch (e) {
      status = {};
    }
  }

  function saveSelection() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(status));
    } catch (e) {
      // storage unavailable — fail silently, app still works this session
    }
  }

  function updateCount() {
    const countEl = document.getElementById('count');
    const n = Object.values(status).filter(s => s > 0).length;
    countEl.textContent = n > 0 ? `${n} wagon${n === 1 ? '' : 's'} in inhibit` : '';
  }

  function render() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    wagons.forEach(num => {
      const s = status[num] || 0;
      const btn = document.createElement('button');
      btn.className = 'wagon' + (STATUS_CLASS[s] ? ' ' + STATUS_CLASS[s] : '');
      btn.textContent = num;
      btn.setAttribute('data-num', num);
      btn.addEventListener('click', () => cycleWagon(num));
      grid.appendChild(btn);
    });
    updateCount();
  }

  function cycleWagon(num) {
    const current = status[num] || 0;
    status[num] = (current + 1) % 4;
    saveSelection();
    render();
  }

  function clearAll() {
    status = {};
    saveSelection();
    render();

    // Master clear: also wipe the defibrillator log's saved status
    try {
      localStorage.removeItem('defibrillator-log-status');
    } catch (e) {
      // storage unavailable — fail silently
    }
  }

  document.getElementById('clearBtn').addEventListener('click', clearAll);

  loadSelection();
  render();

  // Register service worker for offline capability
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('service-worker.js').catch(() => {
        // registration failed silently — app still works online
      });
    });
  }
</script>

</body>
</html>
